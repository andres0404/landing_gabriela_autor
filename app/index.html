<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e8e8e6">
    <title>Los fantasmas del pasado | Gabriela Capellania</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="cover">
      <video class="cover__video" autoplay muted loop playsinline aria-hidden="true">
        <source src="./assets/Ghostly_figures.mp4" type="video/mp4">
      </video>

      <div class="cover__veil" aria-hidden="true"></div>
      <div class="cover__grain" aria-hidden="true"></div>

      <header class="cover__header">
        <span class="cover__series">Novela de terror psicológico</span>
        <span class="cover__mark">GC / 01</span>
      </header>

      <section class="cover__copy" aria-labelledby="book-title">
        <p class="cover__intro">Cuando creías haber encontrado el equilibrio</p>
        <h1 id="book-title">Los<br><em>fantasmas</em><br>del pasado</h1>
        <p class="cover__tagline">vienen a buscarte</p>
      </section>

      <footer class="cover__footer">
        <span class="cover__author">Gabriela<br>Capellania</span>
        <span class="cover__edition">Una nueva voz<br>en la oscuridad</span>
      </footer>
    </main>
  </body>
</html>
